# This rule is not used by the project local-ome itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to serving.local-ome.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: local-ome
    app.kubernetes.io/managed-by: kustomize
  name: localinferenceservice-viewer-role
rules:
- apiGroups:
  - serving.local-ome.com
  resources:
  - localinferenceservices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - serving.local-ome.com
  resources:
  - localinferenceservices/status
  verbs:
  - get
