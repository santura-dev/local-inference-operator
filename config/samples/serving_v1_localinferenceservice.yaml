apiVersion: serving.local-ome.com/v1
kind: LocalInferenceService
metadata:
  labels:
    app.kubernetes.io/name: local-inference-operator
    app.kubernetes.io/managed-by: kustomize
  name: localinferenceservice-sample
spec:
  runtime: vllm
  model:
    uri: "facebook/opt-125m"
    name: "OPT 125M"
  settings:
    batchSize: 1
    precision: fp16
    maxTokens: 100
  scaling:
    replicas: 1
